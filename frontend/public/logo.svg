<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    
    <!-- Shield Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Subtle Border Highlight -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Decorative Background Glow -->
  <circle cx="256" cy="220" r="140" fill="#ffffff" fill-opacity="0.08"/>

  <!-- Enterprise Shield Shape -->
  <path d="M 256,104 L 380,154 C 380,264 326,346 256,388 C 186,346 132,264 132,154 Z"
        fill="#ffffff"
        fill-opacity="0.14"
        stroke="#ffffff"
        stroke-width="8"
        stroke-linejoin="round"/>

  <!-- Inner Lock / Sparkle Accent -->
  <path d="M 256,128 L 360,170 C 360,258 316,326 256,362 C 196,326 152,258 152,170 Z"
        fill="#ffffff"
        fill-opacity="0.08"/>

  <!-- Monogram "ST" in Bold Typography -->
  <g fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-weight="900" text-anchor="middle">
    <!-- Main ST Monogram -->
    <text x="256" y="292" font-size="148" letter-spacing="-4">ST</text>
  </g>

  <!-- Small Security Shield Core Indicator -->
  <circle cx="256" cy="336" r="10" fill="url(#accentGrad)"/>
</svg>
